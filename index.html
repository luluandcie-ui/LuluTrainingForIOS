<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45}
@media (display-mode: standalone){body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}}
.ins{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;max-width:520px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:0 12px 40px rgba(0,0,0,.28);font-family:Figtree,system-ui,sans-serif;animation:insUp .35s ease-out}
@keyframes insUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.ins-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ins-top img{width:46px;height:46px;border-radius:11px;flex:none}
.ins-top b{display:block;font-size:16px;line-height:1.25}
.ins-top span{display:block;font-size:13px;color:var(--muted)}
.ins ol{margin:0 0 10px;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.4}
.ins ol svg{width:17px;height:17px;vertical-align:-3px;color:var(--steel)}
.ins p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.4}
.ins-act{display:flex;gap:8px;justify-content:flex-end}
.ins-act button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:11px;padding:10px 14px;cursor:pointer}
.ins-later{background:transparent;color:var(--muted)}
.ins-go{background:var(--accent);color:var(--accent-ink)}
</style>

/* Layout : une colonne téléphone. En-tête collant, contenu, barre d'onglets fixe en bas ; séance et fiches en plein écran par-dessus. */
:root{
  --bg:#ECEEF1; --bg2:#E2E6EA; --surface:#FFFFFF; --ink:#14171B; --muted:#5B6470; --line:#D5DAE0;
  --accent:#D4511A; --accent-ink:#FFFFFF; --accent-soft:#FBE7DD; --steel:#2C5E8F; --steel-soft:#DCE7F2;
  --good:#1D7A52; --good-soft:#DBF0E5; --warn:#9A6200; --warn-soft:#F8EBCF; --bad:#B42318; --bad-soft:#F9E0DD;
  --p:#2C5E8F; --g:#B07A12; --l:#8E4FA8; --hero:#16191E; --hero-ink:#F3F4F6;
  --shadow:0 10px 30px rgba(20,23,27,.16);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --bg2:#272B31; --surface:#1B1E23; --ink:#ECEEF1; --muted:#9AA3AE; --line:#2C3138;
  --accent:#FF7A3D; --accent-ink:#1A0B03; --accent-soft:#3A2116; --steel:#7FB2E5; --steel-soft:#1C2A38;
  --good:#4CC38A; --good-soft:#14301F; --warn:#E5B04A; --warn-soft:#352A12; --bad:#F2796B; --bad-soft:#3A1A17;
  --p:#7FB2E5; --g:#E5B04A; --l:#C99BE0; --hero:#2A3038; --hero-ink:#ECEEF1; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --bg2:#272B31; --surface:#1B1E23; --ink:#ECEEF1; --muted:#9AA3AE; --line:#2C3138;
  --accent:#FF7A3D; --accent-ink:#1A0B03; --accent-soft:#3A2116; --steel:#7FB2E5; --steel-soft:#1C2A38;
  --good:#4CC38A; --good-soft:#14301F; --warn:#E5B04A; --warn-soft:#352A12; --bad:#F2796B; --bad-soft:#3A1A17;
  --p:#7FB2E5; --g:#E5B04A; --l:#C99BE0; --hero:#2A3038; --hero-ink:#ECEEF1; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:20px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.stack{display:grid;gap:12px}
.stack-s{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* En-tête & navigation */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:12px 10px}
.top .row{min-height:44px}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;flex:none}
main.wrap{padding-block:4px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{height:62px;display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Cartes & éléments */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.flat{background:var(--bg2);border-color:transparent}
.card.hero{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.card.hero .muted,.card.hero .label{color:var(--hero-ink);opacity:.72}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.card.hero .btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%;white-space:normal;text-align:center;padding-block:10px}
.btn svg{width:18px;height:18px;flex:none}
.grid2>*,.grid3>*{min-width:0}
.grid2>.btn,.grid3>.btn{white-space:normal;text-align:center;line-height:1.2;padding-inline:10px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.plain{border-color:transparent;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.steel{background:var(--steel-soft);color:var(--steel)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--steel-soft);color:var(--ink)}
.banner.good{background:var(--good-soft);color:var(--ink)}
.banner b{display:block}
.divider{height:1px;background:var(--line);margin-block:4px}
ul.why{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--muted)}
.scanv{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}.scanv video{width:100%;height:100%;object-fit:cover;display:block}.scanv i{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}.scanv+p{margin-top:8px}.scanv i::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--accent);opacity:.9}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Formulaires */
.field{display:grid;gap:5px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px;min-height:46px}
.input:focus{border-color:var(--accent);outline:none}
.unit{position:relative}
.unit .input{padding-right:44px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.search{position:relative}
.search .input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{width:46px;height:46px;font-size:22px;font-weight:600}
.stepper output{flex:1;text-align:center;font-family:var(--f-display);font-size:26px;font-weight:800}
.choice{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%}
.opt b{display:block;font-size:15px}
.opt small{color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:800;font-size:18px}
.opt[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}

/* Barres de progression */
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s}
.bar.p i{background:var(--p)} .bar.g i{background:var(--g)} .bar.l i{background:var(--l)} .bar.good i{background:var(--good)}
.bar.over i{background:var(--bad)}
.macro{display:grid;gap:4px}
.macro .row{font-size:13px}
.macro b{font-variant-numeric:tabular-nums}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.week i{width:100%;aspect-ratio:1;max-width:40px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:16px;color:var(--muted)}
.week i.on{background:var(--accent);color:var(--accent-ink)}
.week i.today{outline:2px solid var(--ink);outline-offset:-2px}

/* Listes */
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%;min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:58px;height:48px;border-radius:10px;background:var(--bg2);flex:none;overflow:hidden;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.star{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none}
.star[aria-pressed="true"]{color:var(--accent)}
.star svg{width:20px;height:20px}

/* Fiches (bottom sheets) */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow);overscroll-behavior:contain;align-content:start;overflow-x:hidden}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;position:sticky;top:-14px;background:var(--bg);padding-block:4px 6px;z-index:2;margin-top:-4px}
.sheet.full .sheet-h{top:calc(-12px - env(safe-area-inset-top,0px))}
.sheet-h h2{font-size:26px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto -6px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.stage svg{display:block;width:100%;height:auto;max-height:42vh}
.cues{margin:0;padding:0;list-style:none;display:grid;gap:9px;counter-reset:c}
.cues li{display:grid;grid-template-columns:26px 1fr;gap:10px;counter-increment:c}
.cues li::before{content:counter(c);font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--ink);color:var(--bg);border-radius:8px;width:24px;height:24px;display:grid;place-items:center}

/* Séance */
.wk-top{position:sticky;top:calc(-12px - env(safe-area-inset-top,0px));z-index:3;background:var(--bg);padding-block:6px 8px;display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.ex.complete{border-color:var(--good)}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.ex-h h3{font-size:21px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:var(--f-display);font-size:18px;font-weight:800;color:var(--muted);text-align:center}
.set .input{padding:9px 38px 9px 10px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.chk{height:46px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.chk svg{width:20px;height:20px;color:var(--muted)}
.set.done .chk{background:var(--good);border-color:var(--good)}
.set.done .chk svg{color:#fff}
.set.done .input{background:var(--good-soft);border-color:transparent}
.warm{font-size:13px;background:var(--bg2);border-radius:10px;padding:8px 10px;color:var(--muted)}
.warm b{color:var(--ink)}
.timer{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.timer .in{pointer-events:auto;width:100%;max-width:528px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.timer .t{font-family:var(--f-display);font-size:32px;font-weight:800;min-width:76px;font-variant-numeric:tabular-nums}
.timer .lb{flex:1;font-size:13px;opacity:.8;min-width:0}
.timer button{border:1px solid currentColor;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700}
.timer .in.over{background:var(--good);color:#fff}

/* Graphiques */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font-family:var(--f-body)}
.chart-cap{font-size:13px;color:var(--muted);min-height:1.4em}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--bg2)}
.heat i.on{background:var(--accent)}
.heat i.fut{background:transparent}
.vol .r{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.vol .track{position:relative;height:12px;background:var(--bg2);border-radius:99px;overflow:hidden}
.vol .band{position:absolute;top:0;bottom:0;background:var(--good-soft)}
.vol .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:99px;background:var(--steel)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.wiz{min-height:100%;display:grid;align-content:start;gap:18px;padding-block:20px 40px}
.brand{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
.brand span{color:var(--accent);display:block}
.logo{width:112px;height:112px;display:block;margin:0 0 14px -8px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.sticky-foot{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-block:14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="sheets"></div>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

const r1=n=>Math.round(n*10)/10;
const fmt=(n,d)=>{if(n==null||isNaN(n))return "–";const v=d==null?r1(n):Number(n.toFixed(d));return v.toLocaleString("fr-FR",{maximumFractionDigits:d==null?1:d})};
const iso=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>iso(new Date());
const pd=s=>new Date(s+"T12:00:00");
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dFR=(s,o)=>pd(s).toLocaleDateString("fr-FR",o||{weekday:"short",day:"numeric",month:"short"});
const mondayOf=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Nutrition : besoins ---------- */
function currentWeight(p){p=p||P;const w=p.weights.slice().sort((a,b)=>a.d.localeCompare(b.d));return w.length?w[w.length-1].kg:p.info.weight}
function needs(p){
  p=p||P;const i=p.info,kg=currentWeight(p),h=i.height,a=i.age||25;
  const bmr=10*kg+6.25*h-5*a+(i.sex==="f"?-161:5);
  const act={sedentaire:1.3,debout:1.45,physique:1.6}[i.activity||"sedentaire"]+(i.days||3)*0.035;
  const tdee=bmr*act;
  let kcal=tdee;
  if(i.goalType==="masse")kcal=tdee+350;
  else if(i.goalType==="force")kcal=tdee+200;
  else if(i.goalType==="perte")kcal=tdee-Math.min(600,tdee*0.2);
  else if(i.goalType==="tonif")kcal=tdee-Math.min(300,tdee*0.1);
  kcal=Math.max(kcal,i.sex==="f"?1300:1600,bmr*1.05);
  kcal=Math.round(kcal/10)*10;
  const bmi=kg/((h/100)**2),refKg=bmi>30?27*(h/100)**2:kg;
  const pk={masse:2,perte:1.8,force:1.8,tonif:1.8,forme:1.4}[i.goalType]||1.6;
  const prot=Math.round(refKg*pk);
  const fat=Math.round(Math.max(kcal*0.27/9,0.8*refKg));
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const fib=Math.max(25,Math.round(kcal/1000*14));
  const water=Math.round(kg*35/250)*250;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb,fib,water};
}

const GOAL_RULES={

function splitFor(info){
  const d=clamp(info.days||3,2,6),lv=info.level||1,pr=info.priorities||[];
  const lowOnly=pr.some(g=>LOWER.includes(g))&&!pr.some(g=>UPPER.includes(g));
  if(d===2)return ["FA","FB"];
  if(d===3){if(lowOnly)return ["GA","FB","GB"];return lv===1?["FA","FB","FC"]:["UA","LA","FC"]}
  if(d===4)return lowOnly?["LA","UA","GB","UB"]:["UA","LA","UB","LB"];
  if(d===5)return lv===1?["UA","LA","UB","LB","FC"]:["UA","LA","PU","PL","LG"];
  return lv===1?["UA","LA","UB","LB","UA","LB"]:["PU","PL","LG","PU","PL","LG"];
}
const SPLIT_TXT=k=>{const s=k.join("");if(k.every(x=>x[0]==="F"))return ["Full body","tout le corps à chaque séance, chaque muscle "+k.length+" fois par semaine"];
  if(s.includes("PU"))return ["Push / Pull / Legs","poussée, tirage et jambes, chaque muscle 2 fois par semaine"];
  if(s.includes("G"))return ["Fessiers & cuisses","jambes et fessiers en priorité, haut du corps entretenu"];
  if(s==="UALAFC")return ["Haut / Bas / Full body","chaque muscle 2 fois par semaine"];
  return ["Haut / Bas","haut et bas du corps en alternance, chaque muscle 2 fois par semaine"]};
function rngFor(seed){return id=>{if(!seed)return 0;let h=2166136261^(seed*7919);for(const c of id){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%1000)/1000}}

function scheme(goal,role,level,e){
  const R=GOAL_RULES[goal]||GOAL_RULES.forme;
  let [sets,mn,mx,rest]=R[role];
  if(level===1&&role==="main")sets=Math.max(3,sets-1);
  if(level===1&&goal==="force"&&role==="main"){mn=5;mx=8}
  if(level===3&&role!=="acc")sets=Math.min(5,sets+(goal==="masse"||goal==="force"?1:0));
  if(e.u==="s"){sets=Math.min(sets,3);mn=mx=level===1?30:level===2?45:60;rest=60}
  else if(e.u==="min"){sets=1;mn=15;mx=20;rest=0}
  else if(!loaded(e)){if(HARD_BW.includes(e.id)){mn=goal==="force"?3:5;mx=goal==="force"?6:12}else{mn=Math.max(mn,goal==="force"?8:10);mx=Math.max(mx,goal==="force"?12:20)}}
  return {sets:Math.min(sets,5),min:mn,max:mx,rest};
}
function candidates(pat,ctx,exclude){
  const fam=PAT_FAMILY[pat]||pat;

}
function pickEx(pat,role,ctx,exclude,depth){
  depth=depth||0;

  const fb=FALLBACK[pat];

  const st=STAPLES[pat]||STAPLES[PAT_FAMILY[pat]]||[];

    if(e.lv>ctx.level)s-=2.5;
    const ri=st.indexOf(e.id);if(ri>=0)s+=(st.length-ri)*.4;
    if(ctx.place==="salle"&&e.eq.includes("elastique"))s-=4;
    if(ctx.place==="salle"&&!e.eq.length&&role!=="acc")s-=1.5;
    if(ctx.place==="salle"&&ctx.level===1&&(e.eq.includes("machine")||e.eq.includes("poulie")))s+=.6;
    if(e.pat===pat)s+=3;

    if(role==="main"&&e.eq.includes("barre"))s+=2;
    if(role==="sec"&&(e.eq.includes("halteres")||e.eq.includes("machine")))s+=1;
    if(ctx.level===1&&e.lv===1)s+=1; if(ctx.level>=2&&e.lv===ctx.level)s+=.5;
    if(ctx.fav.includes(e.id))s+=3;

const CARDIO_SALLE=["ca","velo","rameur"];
function cardioFinisher(info,i){
  const eq=availEq(info);
  if(info.place==="salle")return {id:CARDIO_SALLE[(i||0)%3],sets:1,min:15,max:20,rest:0};
  if(eq.includes("corde"))return {id:"corde",sets:1,min:8,max:10,rest:0};
  return (i||0)%2?{id:"burp",sets:4,min:8,max:12,rest:45}:{id:"course",sets:1,min:15,max:20,rest:0};
}
function weekVolume(days){const v={};Object.keys(GROUPS).forEach(g=>v[g]=0);
  days.forEach(d=>d.ex.forEach(x=>{const e=EXI[x.id];if(!e||e.t==="cardio")return;v[e.g]+=x.sets;(e.s||[]).forEach(g=>{if(v[g]!=null&&g!=="cardio")v[g]+=x.sets*.5})}));return v}

function balanceVolume(days,ctx,goal,level,prio,budget){
  const [lo]=volTarget(goal,level),dead=new Set();
  for(let it=0;it<30;it++){
    const v=directVolume(days);let worst=null,gap=0;
    Object.keys(GROUP_PAT).forEach(g=>{if(dead.has(g))return;let t=(g==="mollets"||g==="abdos")?Math.round(lo*.5):lo;if(prio.includes(g))t=Math.round(t*1.3);const d=t-v[g];if(d>gap){gap=d;worst=g}});
    if(!worst||gap<1)break;
    let done=false;
    for(const d of days){const x=d.ex.find(x=>EXI[x.id]&&EXI[x.id].g===worst&&x.sets<(EXI[x.id].u==="s"?3:4)&&EXI[x.id].u!=="min");
      if(x){const add=exMinutes(Object.assign({},x,{sets:x.sets+1}))-exMinutes(x);if(d.used+add<=budget){x.sets++;d.used+=add;done=true;break}}}
    if(done)continue;
    const order=days.slice().sort((a,b)=>(b.budgetLeft=budget-b.used)-(budget-a.used));
    for(const d of order){
      if(!zoneFits(d.key,worst))continue;
      const e=pickEx(GROUP_PAT[worst],"acc",ctx,d.ex.map(x=>x.id));if(!e||e.g!==worst&&!(e.s||[]).includes(worst))continue;

function generateProgram(info,favEx,seed){
  seed=seed||0;

  const keys=splitFor(info),ctx=makeCtx(info,favEx,seed),dur=info.duration||60,prio=(info.priorities||[]).slice(0,2);
  let cardioMin=R.cardio?Math.round(Math.min(R.cardio,dur*.3)/5)*5:0;if(cardioMin<10)cardioMin=0;
  const budget=dur-6-cardioMin;

    });

    return {id:"d"+(di+1),key:k,name:t.n+(twice?" "+counts[k]:""),sub:t.sub||"",ex,used};
  });

  const vol=directVolume(days),[lo,hi]=volTarget(goal,level),eqUsed=[...new Set(days.flatMap(d=>d.ex.flatMap(x=>EXI[x.id]?EXI[x.id].eq:[])))];
  const st=SPLIT_TXT(keys),mins=days.map(d=>Math.round(d.ex.reduce((a,x)=>a+exMinutes(x),0)+6));
  const main=["pecs","dos","epaules","quadriceps","fessiers"].filter(g=>vol[g]>0);
  const why=[
    st[0]+" sur "+keys.length+" jours : "+st[1]+".",
    "Matériel utilisé : "+(eqUsed.length?eqUsed.map(e=>EQUIP[e].toLowerCase()).join(", ")+(eqUsed.length<availEq(info).length||!availEq(info).length?"":"")+", poids du corps":"poids du corps uniquement")+".",
    "Objectif "+GOALS[goal].toLowerCase()+" : "+R.txt+".",
    "Volume : "+(main.length?Math.round(main.reduce((a,g)=>a+vol[g],0)/main.length):0)+" séries directes par grand muscle et par semaine en moyenne (repère conseillé : "+lo+" à "+hi+").",
    "Durée : environ "+Math.min(...mins)+" à "+Math.max(...mins)+" min par séance, échauffement compris"+(cardioMin?", dont "+cardioMin+" min de cardio":"")+"."

  const noEq=missing.filter(g=>!candidates(GROUP_PAT[g],makeCtx(info,[],0),[]).some(e=>(e.g===g||(e.s||[]).includes(g))&&!e.inj.some(x=>(info.injuries||[]).includes(x))));

const e1rm=(kg,reps)=>kg>0&&reps>0?kg*(1+Math.min(reps,12)/30):0;
function exHistory(exId,p){p=p||P;const out=[];
  p.sessions.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>{const e=s.ex.find(x=>x.id===exId);if(e&&e.sets.length){
    const best=e.sets.reduce((m,x)=>Math.max(m,e1rm(x.kg,x.reps)),0),top=e.sets.reduce((m,x)=>Math.max(m,x.kg||0),0),reps=e.sets.reduce((m,x)=>Math.max(m,x.reps||0),0),vol=e.sets.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0);
    out.push({d:s.date,ts:s.ts,best,top,reps,vol,sets:e.sets})}});return out}
function lastPerf(exId){const h=exHistory(exId);return h.length?h[h.length-1]:null}
function incFor(e){
  const low=["quadriceps","ischios","fessiers","mollets"].includes(e.g);
  if(e.eq.includes("barre"))return low?5:2.5;
  if(e.eq.includes("halteres")||e.eq.includes("kettlebell"))return 2;
  if(e.eq.includes("machine")||e.eq.includes("poulie"))return low?5:2.5;
  return 0;
}
const loaded=e=>incFor(e)>0;
function suggest(item){
  const e=EXI[item.id],l=lastPerf(item.id);
  if(!e||!l)return {kg:"",up:false,txt:""};
  const top=l.top,hit=l.sets.length>=item.sets&&l.sets.every(x=>(x.reps||0)>=item.max);
  if(!loaded(e)){
    if(e.u==="s")return {kg:top||"",up:hit,txt:hit?"+5 s":""};
    return {kg:top||"",up:hit,txt:hit?(e.u==="min"?"":"+1 rep ou lest"):""};
  }
  return {kg:top?(hit?top+incFor(e):top):"",up:hit,txt:hit?"+"+fmt(incFor(e))+" kg":""};
}
function stagnating(p){p=p||P;const out=[];
  const ids=new Set();p.sessions.forEach(s=>s.ex.forEach(x=>ids.add(x.id)));
  ids.forEach(id=>{const e=EXI[id];if(!e||!loaded(e))return;const h=exHistory(id,p);if(h.length<4)return;
    const last3=h.slice(-3),before=h.slice(0,-3);const bb=Math.max(...before.map(x=>x.best)),lb=Math.max(...last3.map(x=>x.best));
    if(lb<=bb+0.01&&daysBetween(last3[0].d,today())<45)out.push(id)});
  return out;
}
function progWeek(prog){if(!prog)return 1;return Math.floor(daysBetween(prog.start,today())/7)+1}

function nextDay(prog){
  if(!prog||!prog.days.length)return null;
  const last=P.sessions.filter(s=>s.prog===prog.id).sort((a,b)=>b.ts-a.ts)[0];
  if(!last)return prog.days[0];
  const i=prog.days.findIndex(d=>d.id===last.day);
  return prog.days[(i+1)%prog.days.length];
}
function weekSessions(ref){const m=mondayOf(ref||today()),e=addDays(m,7);return P.sessions.filter(s=>s.date>=m&&s.date<e)}
function weekStreak(){
  const target=P.info.days||3;let n=0,m=mondayOf(today());
  if(weekSessions(m).length>=target)n++;
  m=addDays(m,-7);
  for(let i=0;i<104;i++){if(weekSessions(m).length>=target){n++;m=addDays(m,-7)}else break}

}

}
function warmup(item,kg){
  const e=EXI[item.id];if(!e||!loaded(e)||!kg)return null;
  const bar=e.eq.includes("barre"),step=bar?2.5:e.eq.includes("halteres")?2:2.5;

function searchFoods(q){
  const all=FOODS.concat(P.food.custom);
  if(!q)return [];
  const t=norm(q).split(/\s+/).filter(Boolean);
  return all.map(f=>{const n=norm(f.n);if(!t.every(w=>n.includes(w)))return null;let s=0;if(n.startsWith(t[0]))s+=3;if(P.food.fav.includes(f.id))s+=2;if(P.food.recent.includes(f.id))s+=1;if(f.id.startsWith("c:"))s+=1;return [s,f]}).filter(Boolean).sort((a,b)=>b[0]-a[0]||a[1].n.length-b[1].n.length).slice(0,40).map(x=>x[1]);
}

const CHARTS={};
function lineChart(id,o){
  /* o: {series:[{pts:[[t,v]],kind:'main'|'target',label}], unit, h} */
  const W=340,H=o.h||180,L=36,R=12,T=14,B=24;
  const all=o.series.flatMap(s=>s.pts);
  if(!all.length)return '<div class="empty small">Pas encore de données.</div>';
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]));if(x1-x0<864e5*6){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  const pad=Math.max((y1-y0)*.15,o.minPad||1);y0-=pad;y1+=pad;
  const nice=(y1-y0)/4,stp=[0.5,1,2,2.5,5,10,20,25,50,100,200,500].find(s=>s>=nice)||1000;
  y0=Math.floor(y0/stp)*stp;y1=Math.ceil(y1/stp)*stp;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  let g="";
  for(let v=y0;v<=y1+1e-9;v+=stp){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmt(v)+'</text>'}
  const span=(x1-x0)/864e5,nt=4;
  for(let i=0;i<=nt;i++){const t=x0+(x1-x0)*i/nt;const d=new Date(t);g+='<text x="'+X(t).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===nt?"end":"middle")+'" font-size="10" fill="var(--muted)">'+d.toLocaleDateString("fr-FR",span>120?{month:"short"}:{day:"numeric",month:"short"})+'</text>'}
  let s="";const pts=[];
  o.series.forEach(se=>{
    if(!se.pts.length)return;
    const d=se.pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
    if(se.kind==="target"){s+='<polyline points="'+d+'" fill="none" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 5"/>';const lp=se.pts[se.pts.length-1];s+='<text x="'+(X(lp[0])-2).toFixed(1)+'" y="'+(Y(lp[1])-7).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+esc(se.label||"objectif")+'</text>';return}
    if(se.pts.length>1){const area=d+" "+X(se.pts[se.pts.length-1][0]).toFixed(1)+","+(H-B)+" "+X(se.pts[0][0]).toFixed(1)+","+(H-B);s+='<polygon points="'+area+'" fill="var(--accent)" opacity=".09"/><polyline points="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'}
    se.pts.forEach((p,i)=>{const last=i===se.pts.length-1;s+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="'+(last?5:3.2)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';pts.push([X(p[0]),Y(p[1]),p[0],p[1]])});
  });
  CHARTS[id]={pts,unit:o.unit||""};
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" data-chart="'+id+'" role="img" aria-label="'+esc(o.aria||"Graphique")+'">'+g+s+'<g class="hl"></g></svg><div class="chart-cap" id="cap-'+id+'">'+(o.cap||"Touche le graphique pour voir une valeur.")+'</div>';
}
document.addEventListener("pointerdown",e=>{
  const svg=e.target.closest("svg[data-chart]");if(!svg)return;const c=CHARTS[svg.dataset.chart];if(!c||!c.pts.length)return;
  const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,x=(e.clientX-r.left)/r.width*vb.width;
  let best=c.pts[0];c.pts.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});

    if(w.step===5&&w.editId&&w.orig&&!w.seen5){w.seen5=true;const k=["goalType","level","days","duration","place","homeEq","priorities","injuries"];if(k.some(x=>JSON.stringify(w.orig[x])!==JSON.stringify(w.info[x])))w.choice="auto"}

function finishWizard(){
  const w=UI.wiz,info=w.info;
  info.name=(info.name||"").trim()||(info.sex==="f"?"Elle":"Moi");
  if(info.targetWeight==="")info.targetWeight=null;
  let prog=null;
  if(w.choice==="auto")prog=w.preview||generateProgram(info,[],w.seed||0);
  else if(w.choice!=="keep"){const t=TEMPLATES.find(x=>x.key===w.choice);if(t)prog=fromTemplate(t,info)}
  if(w.editId){
    loadProfile(w.editId);P.info=Object.assign(P.info,info);
    if(prog){P.programs.push(prog);P.activeProgram=prog.id}
    const gp=G.profiles.find(x=>x.id===P.id);if(gp)gp.name=info.name;
    saveP(true);saveG();UI.wiz=null;render();toast("Profil mis à jour");return;
  }
  info.created=today();info.startWeight=info.weight;
  P=blankProfile(info);
  if(prog){P.programs.push(prog);P.activeProgram=prog.id}
  P.weights.push({d:today(),kg:Number(info.weight)});
  G.profiles.push({id:P.id,name:info.name});G.active=P.id;
  saveP(true);saveG();UI.wiz=null;UI.tab="home";render();
  openSheet("needs",{first:true});
}

function libFilter(f,q){
  const t=norm(q||"").split(/\s+/).filter(Boolean);
  return EX.filter(e=>{
    if(f.g&&e.g!==f.g)return false;
    if(f.place&&!placesOf(e).includes(f.place))return false;
    if(f.lv&&e.lv!==f.lv)return false;
    if(f.fav&&!P.favEx.includes(e.id))return false;
    if(f.mine&&!exOK(e,availEq(P.info)))return false;
    if(t.length){const s=norm(e.n+" "+e.m+" "+GROUPS[e.g]+" "+eqTxt(e));if(!t.every(w=>s.includes(w)))return false}
    return true;
  });
}

/* ---------- Minuteur de repos ---------- */
let tEnd=0,tInt=null,tLabel="",tBeep=false;
function startTimer(sec,label){tEnd=Date.now()+sec*1000;tLabel=label;tBeep=false;clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function stopTimer(){clearInterval(tInt);$("#timer").hidden=true}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.15)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tick(){
  const left=Math.round((tEnd-Date.now())/1000),over=left<=0;if(over&&!tBeep){tBeep=true;beep()}
  if(left<-90){stopTimer();return}
  const a=Math.abs(left),t=(over?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");
  const el=$("#timer");el.hidden=false;
  el.innerHTML='<div class="in'+(over?" over":"")+'"><span class="t">'+t+'</span><span class="lb">'+(over?"C'est reparti : série suivante":"Repos · "+esc(tLabel))+'</span><button data-a="tPlus">+30 s</button><button data-a="tStop">OK</button></div>';
}
ACT.tPlus=()=>{tEnd=Math.max(tEnd,Date.now())+30000;tBeep=false;tick()};
ACT.tStop=()=>stopTimer();

function fdate(){return UI.food.date||today()}
function viewFood(){

let scanStream=null,scanLoop=null;
function stopScan(){if(scanLoop){cancelAnimationFrame(scanLoop);clearTimeout(scanLoop)}scanLoop=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
/* Détecteur : BarcodeDetector du système si dispo (Android), sinon ZXing intégré (iPhone, ordinateurs) */
async function makeDetector(){
  const F=["ean_13","ean_8","upc_a","upc_e"];
  try{if("BarcodeDetector" in window){const sup=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():F;
    if(F.some(f=>sup.includes(f))){const d=new BarcodeDetector({formats:F.filter(f=>sup.includes(f))});return async v=>{const r=await d.detect(v);return r&&r[0]?r[0].rawValue:null}}}}catch(e){}
  if(!window.LuluZX)return null;
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});let flip=false;
  return async v=>{
    const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return null;
    flip=!flip;
    /* zone centrale de l'image, réduite à 960 px max */
    const sw=Math.round(vw*(flip?.86:.6)),sh=Math.round(vh*(flip?.6:.86)),sx=(vw-sw)>>1,sy=(vh-sh)>>1;
    const k=Math.min(1,960/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);
    if(flip){cv.width=w;cv.height=h;cx.drawImage(v,sx,sy,sw,sh,0,0,w,h)}
    else{cv.width=h;cv.height=w;cx.save();cx.translate(h,0);cx.rotate(Math.PI/2);cx.drawImage(v,sx,sy,sw,sh,0,0,w,h);cx.restore()}
    const px=cx.getImageData(0,0,cv.width,cv.height).data,n=cv.width*cv.height,lum=new Uint8ClampedArray(n);
    for(let i=0,j=0;i<n;i++,j+=4)lum[i]=(px[j]*306+px[j+1]*601+px[j+2]*117)>>10;
    return LuluZX.decode(lum,cv.width,cv.height)};
}
ACT.scanStart=async()=>{
  const box=$("#scan-box");if(!box||scanStream)return;
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    box.innerHTML='<div class="scanv"><video id="scan-v" playsinline muted autoplay></video><i></i></div><p class="small muted">Vise le code-barres, bien éclairé, à 10–15 cm.</p><button class="btn ghost block" data-a="scanStop">Arrêter le scan</button>';
    const v=$("#scan-v");v.setAttribute("playsinline","");v.srcObject=scanStream;await v.play();
    const detect=await makeDetector();
    if(!detect){stopScan();box.innerHTML='<div class="banner info"><span>Le scan n\'est pas disponible sur cet appareil. Tape les chiffres sous le code-barres.</span></div>';return}
    const tick=async()=>{
      if(!scanStream)return;
      let code=null;try{code=await detect(v)}catch(e){}
      if(!scanStream)return;
      if(code&&/^\d{8,14}$/.test(code)){stopScan();box.innerHTML="";try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}const f=$("#f-code");if(f)f.value=code;lookupCode(code);return}
      scanLoop=setTimeout(tick,90)};
    tick();
  }catch(e){stopScan();box.innerHTML='<div class="banner warn"><span>Impossible d\'accéder à l\'appareil photo. Autorise la caméra dans les réglages, ou tape le code à la main.</span></div>'}
};
ACT.scanStop=()=>{stopScan();const box=$("#scan-box");if(box)box.innerHTML=""};
ACT.codeLookup=()=>{const c=($("#f-code").value||"").replace(/\D/g,"");if(c.length<8){$("#code-msg").textContent="Un code-barres compte 8 ou 13 chiffres.";return}lookupCode(c)};
async function lookupCode(code){
  const msg=$("#code-msg"),meal=topSheet().data.meal;
  const known=P.food.custom.find(f=>f.code===code);if(known){openSheet("foodQty",{fid:known.id,meal});return}
  if(msg)msg.textContent="Recherche sur Open Food Facts…";
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,product_name_fr,brands,nutriments,serving_quantity,serving_size",{signal:ctl.signal});
    clearTimeout(to);const j=await r.json();
    if(!j||j.status!==1||!j.product){if(msg)msg.innerHTML='Produit introuvable. <button class="btn soft sm" data-a="customFood" data-code="'+code+'">Le créer moi-même</button>';return}
    const p=j.product,nu=p.nutriments||{},num=v=>Math.round((Number(v)||0)*10)/10;
    const name=((p.product_name_fr||p.product_name||"Produit "+code)+(p.brands?" · "+p.brands.split(",")[0]:"")).trim();
    const f={id:"c:"+code,n:name,k:num(nu["energy-kcal_100g"]||(nu.energy_100g?nu.energy_100g/4.184:0)),p:num(nu.proteins_100g),g:num(nu.carbohydrates_100g),l:num(nu.fat_100g),fi:num(nu.fiber_100g),pu:p.serving_quantity?"1 portion":null,pg:p.serving_quantity?num(p.serving_quantity):null,code};
    P.food.custom=P.food.custom.filter(x=>x.id!==f.id).concat([f]);saveP();
    openSheet("foodQty",{fid:f.id,meal});
  }catch(e){if(msg)msg.innerHTML='Impossible de joindre Open Food Facts. Vérifie ta connexion internet, ou crée l\'aliment toi-même. <button class="btn soft sm" data-a="customFood" data-code="'+code+'">Créer l\'aliment à la main</button>'}
}

function stSessions(){
  const ss=P.sessions.slice().sort((a,b)=>b.ts-a.ts);
  const month=today().slice(0,7),inMonth=ss.filter(s=>s.date.startsWith(month)).length;
  let h='<div class="stats"><div class="stat"><b>'+ss.length+'</b><span>séances au total</span></div><div class="stat"><b>'+inMonth+'</b><span>ce mois-ci</span></div><div class="stat"><b>'+weekStreak()+'</b><span>semaines d\'affilée</span></div></div>';
  /* calendrier 12 semaines */
  const m0=addDays(mondayOf(today()),-77),days=new Set(ss.map(s=>s.date));
  let cells="";for(let r=0;r<7;r++)for(let c=0;c<12;c++){const d=addDays(m0,c*7+r);cells+='<i class="'+(d>today()?"fut":days.has(d)?"on":"")+'" title="'+dFR(d)+'"></i>'}
  h+='<section class="card stack-s"><div class="row between"><span class="label">12 dernières semaines</span><span class="tiny muted">une colonne = une semaine</span></div><div class="heat" role="img" aria-label="Calendrier des séances">'+cells+'</div></section>';
  /* volume */
  const m=mondayOf(today()),v=volumeByGroup(m,addDays(m,7)),lo=P.info.level===1?8:10,hi=P.info.level===1?14:20,max=Math.max(hi+4,...Object.values(v));
  h+='<section class="card stack-s"><div class="row between"><span class="label">Séries par muscle cette semaine</span></div><div class="vol stack-s">'+
    Object.keys(GROUPS).filter(g=>g!=="cardio").map(g=>'<div class="r"><span>'+GROUPS[g]+'</span><div class="track"><div class="band" style="left:'+(lo/max*100)+'%;width:'+((hi-lo)/max*100)+'%"></div><div class="fill" style="width:'+(Math.min(v[g],max)/max*100)+'%"></div></div><b class="num" style="text-align:right">'+fmt(v[g])+'</b></div>').join("")+
    '</div><p class="tiny muted">Zone verte : '+lo+' à '+hi+' séries par semaine, la fourchette efficace pour progresser. Les muscles secondaires comptent pour une demi-série.</p></section>';
  h+='<div class="label">Historique</div>'+(ss.length?'<div class="card list">'+ss.slice(0,40).map(s=>'<button class="li" data-a="openSession" data-id="'+s.id+'"><span class="t"><b>'+esc(s.name)+'</b><small>'+dFR(s.date,{weekday:"long",day:"numeric",month:"long"})+' · '+s.ex.length+' exercices'+(s.feel?' · '+FEEL[s.feel]:'')+'</small></span>'+IC.next.replace("<svg",'<svg style="width:18px;height:18px;color:var(--muted)"')+'</button>').join("")+'</div>':'<div class="card empty"><h3>Aucune séance</h3>Lance ta première séance depuis l\'accueil : elle apparaîtra ici.</div>');
  return h;
}
function stEx(){
  const ids={};P.sessions.forEach(s=>s.ex.forEach(x=>{ids[x.id]=(ids[x.id]||0)+1}));
  const list=Object.keys(ids).filter(id=>EXI[id]&&EXI[id].u!=="min").sort((a,b)=>ids[b]-ids[a]);
  if(!list.length)return '<div class="card empty"><h3>Pas encore de données</h3>Tes records et courbes par exercice apparaîtront après tes premières séances.</div>';
  if(!UI.prog.ex||!ids[UI.prog.ex])UI.prog.ex=list[0];
  const e=EXI[UI.prog.ex],h=exHistory(e.id),ld=loaded(e);
  let s='<section class="card stack-s"><label class="field"><span>Exercice</span><select class="input" id="st-ex" data-ch="stEx">'+list.map(id=>'<option value="'+id+'"'+(id===e.id?" selected":"")+'>'+esc(EXI[id].n)+'</option>').join("")+'</select></label>'+
    lineChart("st-"+e.id,{series:[{pts:h.map(x=>[pd(x.d).getTime(),ld?r1(x.best):x.reps])}],unit:ld?"kg":"reps",aria:"Progression de "+e.n,cap:ld?"1RM estimé : la charge théorique maximale sur 1 répétition, calculée à partir de tes séries.":"Meilleur nombre de répétitions par séance."})+'</section>';
  s+='<div class="label">Records personnels</div><div class="card list">'+list.map(id=>{const x=EXI[id],hh=exHistory(id),l=loaded(x);
    const bi=hh.reduce((b,z)=>((l?z.best:z.reps)>(l?b.best:b.reps)?z:b),hh[0]);
    const topSet=l?bi.sets.reduce((b,z)=>e1rm(z.kg,z.reps)>e1rm(b.kg,b.reps)?z:b,bi.sets[0]):null;
    return '<button class="li" data-a="stPickEx" data-id="'+id+'"><span class="t"><b>'+esc(x.n)+'</b><small>'+(l?fmt(topSet.kg)+' kg × '+topSet.reps+' · ':'')+dFR(bi.d,{day:"numeric",month:"short",year:"numeric"})+'</small></span><b class="num" style="white-space:nowrap">'+(l?fmt(bi.best)+' kg':fmt(bi.reps,0)+' reps')+'</b></button>'}).join("")+'</div><p class="tiny muted">Pour les exercices avec charge, le record est le 1RM estimé (formule d\'Epley).</p>';
  return s;
}

    '<div class="grid3">'+Object.keys(MEAS).map(m=>'<label class="field"><span class="tiny">'+MEAS[m]+'</span><div class="unit"><input class="input num" style="padding-right:34px" id="ms-'+m+'" type="number" inputmode="decimal" step="0.5"><em>cm</em></div></label>').join("")+'</div>'+
    '<button class="btn dark" data-a="addMeas">Enregistrer les mesures du jour</button><p class="tiny muted">Mesure toujours au même endroit, le matin, ruban à plat sans serrer. Remplis seulement ce que tu veux suivre.</p></section>';

  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();$("#exp-msg").textContent="Si rien ne s'est téléchargé, utilise « Copier le texte »."}catch(e){toast("Utilise « Copier le texte »")}

const CM_MAP={tv:"tvs"},CF_MAP={sdr:"sdrh",dh:"di",gb:"gbu"},CM_DAYS={HA:"d1",BA:"d2",HB:"d3",BB:"d4"},CF_DAYS={A:"d1",B:"d2",C:"d3"};
ACT.doImport=()=>{
  const msg=$("#imp-msg");let j;
  try{j=JSON.parse($("#imp-t").value.trim())}catch(e){msg.textContent="Ce texte n'est pas une sauvegarde valide. Vérifie que tu as tout copié.";return}
  if(j&&(j.app==="lulutraining"||j.app==="forge")&&Array.isArray(j.profiles)){
    j.profiles.forEach(p=>{if(!p||!p.id||!p.info)return;LS.set("forge:p:"+p.id,p);const g=G.profiles.find(x=>x.id===p.id);if(g)g.name=p.info.name;else G.profiles.push({id:p.id,name:p.info.name})});
    if(!G.active||!G.profiles.some(x=>x.id===G.active))G.active=G.profiles[0]&&G.profiles[0].id;saveG();loadProfile(G.active);
    UI.sheets=[];renderSheets();UI.wiz=null;UI.tab="home";render();toast(j.profiles.length+" profil"+(j.profiles.length>1?"s":"")+" restauré"+(j.profiles.length>1?"s":""));return;
  }
  if(j&&(j.app==="carnet-muscu"||j.app==="carnet-forme")){
    if(!P){msg.textContent="Crée d'abord ton profil, puis importe tes séances.";return}
    const cm=j.app==="carnet-muscu",map=cm?CM_MAP:CF_MAP,dmap=cm?CM_DAYS:CF_DAYS,key=cm?"cm":"cf";
    let prog=P.programs.find(p=>p.tpl===key);
    if(!prog){prog=fromTemplate(TEMPLATES.find(t=>t.key===key));P.programs.push(prog);if(!P.activeProgram)P.activeProgram=prog.id}
    let n=0;(j.sessions||[]).forEach((s,ix)=>{
      const imp=j.app+":"+(s.id||s.date+ix);if(P.sessions.some(x=>x.imp===imp))return;
      const ex=(s.ex||[]).map(x=>({id:map[x.id]||x.id,sets:(x.sets||[]).map(z=>({kg:Number(z.kg)||0,reps:Number(z.reps)||0}))})).filter(x=>EXI[x.id]&&x.sets.length);
      if(!ex.length)return;
      P.sessions.push({id:uid(),imp,date:s.date,ts:pd(s.date).getTime()+ix,prog:prog.id,day:dmap[s.day]||null,name:s.name||"Séance",feel:0,note:"",ex});n++;
    });
    let w=0;(j.weights||[]).forEach(x=>{if(x&&x.d&&x.kg&&!P.weights.some(y=>y.d===x.d)){P.weights.push({d:x.d,kg:Number(x.kg)});w++}});
    saveP(true);UI.sheets=[];renderSheets();render();toast(n+" séance"+(n>1?"s":"")+" et "+w+" pesée"+(w>1?"s":"")+" récupérée"+(n+w>1?"s":""));return;
  }
  msg.textContent="Format non reconnu. Utilise un fichier de sauvegarde LuluTraining.";
};

/* ---------- Rappels (appli Android) ---------- */
const DAYL=["L","M","M","J","V","S","D"];
function remCfg(){try{return JSON.parse(LuluNative.getReminder())}catch(e){return {on:false,h:18,m:0,days:[1,2,4,5]}}}
function remindersHTML(){
  if(!(window.LuluNative&&LuluNative.getReminder))return "";
  const c=UI.rem||(UI.rem=remCfg());
  return '<div class="field"><span>Rappels de séance</span><div class="card stack-s"><div class="row between"><b>'+(c.on?"Activés":"Désactivés")+'</b><button class="btn sm '+(c.on?"soft":"dark")+'" data-a="remToggle">'+(c.on?"Désactiver":"Activer")+'</button></div>'+
   '<div class="row"><span class="small muted grow">Heure du rappel</span><input class="input" style="width:130px" type="time" id="rem-t" value="'+String(c.h).padStart(2,"0")+':'+String(c.m).padStart(2,"0")+'" data-ch="remTime"></div>'+
   '<div class="chips">'+DAYL.map((l,i)=>'<button class="chip" data-a="remDay" data-v="'+(i+1)+'" aria-pressed="'+c.days.includes(i+1)+'" aria-label="'+["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"][i]+'">'+l+'</button>').join("")+'</div>'+
   '<small class="muted">Une notification te rappelle ta séance les jours choisis.</small></div></div>';
}
function remSave(){const r=LuluNative.setReminder(JSON.stringify(UI.rem));if(r==="permission")toast("Autorise les notifications pour recevoir les rappels.");refreshSheet()}
ACT.remToggle=()=>{UI.rem.on=!UI.rem.on;if(UI.rem.on&&!UI.rem.days.length)UI.rem.days=[1,3,5];remSave();toast(UI.rem.on?"Rappels activés":"Rappels désactivés")};
ACT.remDay=el=>{const d=+el.dataset.v,a=UI.rem.days,i=a.indexOf(d);i>=0?a.splice(i,1):a.push(d);a.sort();remSave()};
CHG.remTime=el=>{const p=el.value.split(":");if(p.length<2)return;UI.rem.h=+p[0];UI.rem.m=+p[1];remSave()};

/* ===== Démarrage ===== */
(function init(){
  if(G.active&&!loadProfile(G.active)){G.active=null}
  if(!G.active&&G.profiles.length){G.active=G.profiles[0].id;if(!loadProfile(G.active))G.active=null}
  /* migrations légères */
  if(P){P.food=P.food||{days:{},custom:[],meals:[],recent:[],fav:[]};["custom","meals","recent","fav"].forEach(k=>P.food[k]=P.food[k]||[]);P.food.days=P.food.days||{};P.favEx=P.favEx||[];P.measures=P.measures||[];P.strengthGoals=P.strengthGoals||[]}
  applyTheme();render();
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(G.theme!=="light"&&G.theme!=="dark")applyTheme()})}catch(e){}
  /* bouton retour Android */
  window.luluBack=function(){
    if(UI.sheets.length){closeSheet();return true}
    if(UI.wiz&&UI.wiz.step>0&&(UI.wiz.step>1||!UI.wiz.editId)){ACT.wizBack();return true}
    if(UI.wiz&&G.profiles.length){UI.wiz=null;render();return true}
    if(UI.tab!=="home"){UI.tab="home";render();window.scrollTo(0,0);return true}
    return false};
  document.addEventListener("visibilitychange",()=>{if(document.hidden)saveP(true)});
  window.addEventListener("pagehide",()=>saveP(true));
})();

</script>
<div id="install" class="ins" hidden role="dialog" aria-label="Installer LuluTraining"></div>
<script>
(function(){
  "use strict";
  var SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  var ua=navigator.userAgent||"";
  var ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches;
  var web=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";

  /* Hors ligne : service worker */
  if("serviceWorker" in navigator&&web){
    var hadCtl=!!navigator.serviceWorker.controller;
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(hadCtl&&typeof toast==="function")toast("Mise à jour prête : elle s'appliquera à la prochaine ouverture");hadCtl=true});
  }
  /* Données protégées du nettoyage automatique quand l'appli est installée */
  if(standalone&&navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(function(p){if(!p)return navigator.storage.persist()}).catch(function(){})}

  /* Aide à l'installation */
  var el=document.getElementById("install"),K="lulu:installHint",deferred=null;
  function snoozed(){try{return Number(localStorage.getItem(K)||0)>Date.now()}catch(e){return false}}
  function snooze(days){el.hidden=true;try{localStorage.setItem(K,String(Date.now()+days*864e5))}catch(e){}}
  function head(sub){return '<div class="ins-top"><img src="apple-touch-icon.png" alt=""><div><b>Installe LuluTraining</b><span>'+sub+'</span></div></div>'}
  function showIOS(){
    el.innerHTML=head("Gratuit, sans App Store, marche hors ligne")+
      '<ol><li>Dans Safari, touche '+SHARE+' <b>Partager</b> (sur les iPhone récents : touche <b>•••</b> puis <b>Partager</b>).</li>'+
      '<li>Choisis <b>« Sur l\'écran d\'accueil »</b>. Fais défiler la liste si tu ne le vois pas.</li>'+
      '<li>Touche <b>Ajouter</b>, puis ouvre LuluTraining depuis l\'icône de Lulu.</li></ol>'+
      '<p>Installe l\'appli avant de créer ton profil : les données de l\'appli installée sont séparées de celles de Safari.</p>'+
      '<div class="ins-act"><button class="ins-later" data-ins="later">Plus tard</button><button class="ins-go" data-ins="ok">Compris</button></div>';
    el.hidden=false}
  function showAndroid(){
    el.innerHTML=head("Gratuit, marche hors ligne, s\'ouvre comme une appli")+
      '<div class="ins-act"><button class="ins-later" data-ins="later">Plus tard</button><button class="ins-go" data-ins="install">Installer</button></div>';
    el.hidden=false}
  el.addEventListener("click",function(e){
    var b=e.target.closest("[data-ins]");if(!b)return;var a=b.getAttribute("data-ins");
    if(a==="install"&&deferred){deferred.prompt();deferred.userChoice.then(function(r){deferred=null;snooze(r&&r.outcome==="accepted"?3650:14)}).catch(function(){snooze(14)});el.hidden=true;return}
    snooze(a==="ok"?30:7)});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;if(!standalone&&!snoozed())showAndroid()});
  window.addEventListener("appinstalled",function(){el.hidden=true;snooze(3650)});
  if(ios&&!standalone&&web&&!snoozed())setTimeout(showIOS,1200);
})();
</script>
</body>
